[supervisord]
logfile=/dev/null
loglevel=info
nodaemon=true
pidfile=/data/run/supervisord.pid
environment=DBUS_SESSION_BUS_ADDRESS="unix:path=/data/run/dbus.sock"

[program:dbus]
priority=5
user=spotify
command=dbus-daemon --nofork --config-file=/opt/runtime/share/dbus-1/session.conf --address=unix:path=/data/run/dbus.sock
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:auth-server]
priority=10
user=spotify
command=python3 /opt/spotify-headless/auth-server.py
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:reverse-proxy]
priority=10
user=spotify
command=nginx -c /opt/spotify-headless/nginx.conf -g "daemon off;"
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvfb]
priority=10
user=spotify
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -noreset
environment=XKB_CONFIG_ROOT="/opt/runtime/share/X11/xkb"
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulseaudio]
priority=10
user=spotify
command=/opt/spotify-headless/pulseaudio.sh
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:icecast]
priority=10
user=spotify
command=icecast -c /data/run/icecast.xml
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mediamtx]
priority=10
user=spotify
command=mediamtx /data/run/mediamtx.yml
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
priority=20
user=spotify
command=openbox
environment=DISPLAY=":99"
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnc]
priority=20
user=spotify
command=x11vnc -display :99 -rfbport 5900 -rfbauth /data/run/vnc.pass -forever -shared
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
priority=20
user=spotify
command=novnc --listen 0.0.0.0:6080 --vnc 127.0.0.1:5900 --file-only
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:spotify]
priority=30
user=spotify
command=spotify --disable-gpu --no-sandbox --password-store=basic --device-name="%(ENV_SPOTIFY_DEVICE_NAME)s"
environment=DISPLAY=":99",PULSE_SINK="spotify_stream"
autorestart=true
startsecs=3
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:auto-login-click]
priority=35
user=spotify
command=/opt/spotify-headless/auto-login-click.sh
environment=DISPLAY=":99"
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:stream-64k]
priority=40
user=spotify
command=/opt/spotify-headless/stream.sh 64
autorestart=true
startsecs=2
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:stream-96k]
priority=40
user=spotify
command=/opt/spotify-headless/stream.sh 96
autorestart=true
startsecs=2
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:stream-128k]
priority=40
user=spotify
command=/opt/spotify-headless/stream.sh 128
autorestart=true
startsecs=2
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:stream-webrtc]
priority=40
user=spotify
command=/opt/spotify-headless/webrtc-stream.sh
autorestart=true
startsecs=2
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
