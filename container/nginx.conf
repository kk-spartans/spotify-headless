pid /data/run/nginx.pid;
error_log /data/logs/nginx-error.log info;

events {}

http {
  access_log /data/logs/nginx-access.log;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 8080;
    server_name _;

    # Keep redirects relative so they stay within the visitor's hostname/scheme.
    # Without this, nginx emits absolute URLs like http://HOST:8080/... (its own
    # listening port), which breaks a reverse proxy such as the Tailscale Funnel
    # serve config that exposes the app on https://<domain> (port 443).
    absolute_redirect off;

    location = / {
      return 302 /vnc/vnc.html?autoconnect=true&resize=scale&path=vnc/websockify;
    }

    location = /vnc {
      return 302 /vnc/vnc.html?autoconnect=true&resize=scale&path=vnc/websockify;
    }

    location /vnc/ {
      proxy_pass http://127.0.0.1:6080/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }

    location = /auth {
      return 308 /auth/;
    }

    location /auth/ {
      proxy_pass http://127.0.0.1:6090/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Prefix /auth;
    }

    location = /spotify {
      proxy_pass http://127.0.0.1:8889;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location /spotify/ {
      proxy_pass http://127.0.0.1:8889;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location ~ ^/spotify-(64|96|128)\.opus$ {
      proxy_pass http://127.0.0.1:8000;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
