services:
  spotify:
    image: ghcr.io/kk-spartans/spotify-headless:latest
    build:
      context: .
    container_name: spotify-headless
    hostname: spotify-headless
    init: true
    restart: unless-stopped
    shm_size: 512mb
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      ICECAST_ADMIN_PASSWORD: deadbeef
      ICECAST_SOURCE_PASSWORD: feedface
      VNC_PASSWORD: spotify
      SPOTIFY_DEVICE_NAME: spotify-headless
      AUTO_LOGIN_CLICK: "true"
      WEBRTC_ADDITIONAL_HOST: 0.0.0.0
      WEBRTC_TAILSCALE_HOST: 0.0.0.0
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "8189:8189/udp"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
