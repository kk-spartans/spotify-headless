name: Container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  flake-update:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update and commit flake lock
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "flake.lock is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "Update Nix flake inputs"
          git push https://x-access-token:${{ secrets.FLAKE_UPDATE_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

  publish:
    if: github.event_name != 'schedule' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: container-publish-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Get image tag
        id: image
        run: echo "tag=$(git rev-parse --short=6 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kk-spartans/spotify-headless:${{ steps.image.outputs.tag }}
            ghcr.io/kk-spartans/spotify-headless:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: container-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out pull request
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "short=${HEAD_SHA:0:6}" >> "$GITHUB_OUTPUT"

      - name: Build and push PR image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kk-spartans/spotify-headless:pr-${{ github.event.pull_request.number }}
            ghcr.io/kk-spartans/spotify-headless:pr-${{ github.event.pull_request.number }}-${{ steps.tags.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment image tag on PR
        uses: actions/github-script@v7
        env:
          PR_SHORT: ${{ steps.tags.outputs.short }}
        with:
          script: |
            const marker = '<!-- pr-image -->';
            const number = context.payload.pull_request.number;
            const short = process.env.PR_SHORT;
            const floating = `ghcr.io/kk-spartans/spotify-headless:pr-${number}`;
            const pinned = `${floating}-${short}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n### PR image ready\n\nBuilt from \`${sha}\`:\n\n- latest commit: \`${floating}\` (\`docker pull ${floating}\`)\n- this commit: \`${pinned}\` (\`docker pull ${pinned}\`)`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: number,
            });
            const existing = comments.find(
              (comment) => comment.body?.includes(marker) && comment.user?.type === 'Bot',
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body,
              });
            }
