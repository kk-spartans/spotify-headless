name: Container

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  flake-update:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update and commit flake lock
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "flake.lock is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "Update Nix flake inputs"
          git push https://x-access-token:${{ secrets.FLAKE_UPDATE_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

  publish:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: container-publish-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Get image tag
        id: image
        run: echo "tag=$(git rev-parse --short=6 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kk-spartans/spotify-headless:${{ steps.image.outputs.tag }}
            ghcr.io/kk-spartans/spotify-headless:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
